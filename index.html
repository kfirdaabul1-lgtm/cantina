<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#132033">
<title>גו קנטינה נוריות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Suez+One&display=swap">
<style>
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: a restaurant operations board — sticky header with week + tabs, department sections holding day×shift grids. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#E2E7EE; --ink:#132033; --muted:#566377; --line:#D2D9E3;
  --brass:#8A5E0E; --brass-bg:#F2E4C4;
  --ok:#1D734A; --ok-bg:#DCEFE4; --warn:#A04B17; --warn-bg:#FAE6D4; --bad:#AE2318; --bad-bg:#F9E0DC;
  --chipS:52%; --chipL:90%; --chipFg:26%;
  --scrim:rgb(12 18 28 / .45);
  --s-lab:#2a78d6; --s-sup:#eb6834;
  --f-display:"Suez One","Frank Ruhl Libre",Georgia,serif;
  --f-body:"IBM Plex Sans Hebrew","Rubik","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#17202B; --sunk:#111822; --ink:#E4EAF2; --muted:#97A3B4; --line:#29344399;
  --brass:#E2B65E; --brass-bg:#3A2D14;
  --ok:#57C891; --ok-bg:#163326; --warn:#F2A267; --warn-bg:#3A2414; --bad:#F2806F; --bad-bg:#3B1A17;
  --chipS:40%; --chipL:22%; --chipFg:82%; --scrim:rgb(0 0 0 / .6); --s-lab:#3987e5; --s-sup:#d95926; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#17202B; --sunk:#111822; --ink:#E4EAF2; --muted:#97A3B4; --line:#29344399;
  --brass:#E2B65E; --brass-bg:#3A2D14;
  --ok:#57C891; --ok-bg:#163326; --warn:#F2A267; --warn-bg:#3A2414; --bad:#F2806F; --bad-bg:#3B1A17;
  --chipS:40%; --chipL:22%; --chipFg:82%; --scrim:rgb(0 0 0 / .6); --s-lab:#3987e5; --s-sup:#d95926; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400;font-size:1.6rem;line-height:1.2}
h2{font-family:var(--f-display);font-weight:400;font-size:1.2rem}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:36px;height:36px;border-radius:9px;background:var(--ink);color:var(--brass-bg);display:grid;place-items:center;flex:none}
.b1{font-family:var(--f-display);font-size:1.15rem;line-height:1.1}
.b2{font-size:.82rem;color:var(--muted)}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.2rem;cursor:pointer}
.wk{display:flex;align-items:center;gap:8px;padding-inline:6px}
.wk-l{font-size:.78rem;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{font:inherit;font-weight:500;border:0;background:none;color:var(--muted);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brass)}

main{padding-block:20px 64px}
.stack{display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-direction:column;gap:14px}
.head-t{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.lede{color:var(--muted);max-width:68ch}

/* controls */
.btn{font:inherit;font-weight:500;font-size:.92rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.brass{background:var(--brass-bg);color:var(--brass);border-color:transparent}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;font-size:.78rem;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.brass{background:var(--brass-bg);color:var(--brass)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input[type=text],input[type=tel],input[type=number],input[type=time],input[type=url],input[type=email],input[type=month],input[type=date],textarea,select{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;background:var(--sunk)}
.seg button{font:inherit;font-size:.9rem;border:0;border-radius:6px;padding:6px 14px;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600}

/* dept chips */
.dchip{--h:210;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;font:inherit;font-size:.84rem;font-weight:500;padding:4px 11px;border-radius:999px;background:hsl(var(--h) var(--chipS) var(--chipL));color:hsl(var(--h) 45% var(--chipFg));cursor:pointer;white-space:nowrap}
.dchip.off{background:transparent;border-color:var(--line);color:var(--muted)}
.dchip.all{--h:215}
.dfilter{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:.8rem;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:1.45rem;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--muted)}
.kpi .s.bad{color:var(--bad)} .kpi .s.ok{color:var(--ok)}

/* department section + grid */
.dept{--h:210;display:flex;flex-direction:column;gap:8px}
.dept-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.sw{width:12px;height:12px;border-radius:3px;background:hsl(var(--h) 55% 50%);align-self:center}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
table.grid{border-collapse:separate;border-spacing:4px;width:100%;min-width:700px;table-layout:fixed}
table.grid th{font-weight:500;font-size:.82rem;color:var(--muted);text-align:center;padding:2px}
table.grid thead th span{display:block;color:var(--ink);font-weight:600}
table.grid thead th small{font-family:var(--f-mono);font-size:.74rem}
table.grid thead th.sat span{color:var(--brass)}
table.grid th.kind{width:88px;text-align:start;vertical-align:top;padding-top:8px}
table.grid th.kind b{display:block;color:var(--ink);font-weight:600}
table.grid th.kind small{font-size:.72rem}
td.off{text-align:center;color:var(--line);font-size:1.1rem}
.cell{width:100%;min-height:66px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;padding:6px 6px 22px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:start;position:relative;font:inherit;cursor:pointer}
div.cell{cursor:default}
.cell.empty{background:var(--bad-bg);border-color:transparent}
.cell.part{background:var(--warn-bg);border-color:transparent}
.cell.full{background:var(--ok-bg);border-color:transparent}
.cell .cnt{position:absolute;bottom:4px;inset-inline-end:7px;font-size:.72rem;color:var(--muted)}
.cell.empty .cnt{color:var(--bad)} .cell.part .cnt{color:var(--warn)} .cell.full .cnt{color:var(--ok)}
.nm{font-size:.76rem;line-height:1.35;background:var(--surface);border-radius:4px;padding:1px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm.me{background:var(--ink);color:var(--surface)}
.step{display:flex;align-items:center;justify-content:space-between;gap:2px;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--surface)}
.step.on{background:hsl(var(--h) var(--chipS) var(--chipL));border-color:transparent}
.step button{width:28px;height:28px;border-radius:6px;border:0;background:var(--sunk);color:var(--ink);font-size:1rem;cursor:pointer}
.step b{font-family:var(--f-mono);font-weight:500;min-width:1.5em;text-align:center}
.step.on b{color:hsl(var(--h) 45% var(--chipFg))}

/* panels / lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.2fr) minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);text-align:start;background:none;border-inline:0;border-bottom:0;font:inherit;color:inherit;cursor:pointer;width:100%}
.li:first-child{border-top:0}
.li:hover{background:var(--sunk)}
.li .n{font-weight:600}
.li .sub{font-size:.82rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips .dchip{font-size:.74rem;padding:1px 8px;cursor:default}
@media (max-width:720px){.li{grid-template-columns:minmax(0,1fr) auto}.li .c2,.li .c3{grid-column:1 / -1}}

/* availability */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.day-h{display:flex;justify-content:space-between;align-items:baseline}
.day-h b{font-size:1rem}
.day-h{gap:8px;align-items:center}
.dayall{font:inherit;font-size:.8rem;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 11px;cursor:pointer;white-space:nowrap}
.dayall[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.dayall[disabled]{opacity:.5;cursor:default}
.slot{--h:210;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;font:inherit;text-align:start;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.slot .t{display:flex;flex-direction:column;line-height:1.3}
.slot .t small{color:var(--muted);font-size:.78rem}
.slot .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;font-size:.85rem}
.slot.on{background:hsl(var(--h) var(--chipS) var(--chipL));border-color:transparent}
.slot.on .box{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.slot[disabled]{cursor:default;opacity:.75}

/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:12px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:hsl(var(--h) 55% 50%);border-radius:4px}
.bar .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:end;direction:ltr}
table.plain{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px}
table.plain th,table.plain td{padding:9px 10px;border-top:1px solid var(--line);text-align:start}
table.plain th{font-weight:500;color:var(--muted);font-size:.8rem;border-top:0}
table.plain td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:end}
table.plain th.num{text-align:end}
.scroll-x{overflow-x:auto}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.panel{background:var(--surface);width:min(580px,100%);max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:720px){.sheet{align-items:center}.panel{border-radius:16px}}
.panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{border:0;background:var(--sunk);color:var(--ink);width:32px;height:32px;border-radius:8px;font-size:1.1rem;cursor:pointer;flex:none}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px}
.prow .who{display:flex;flex-direction:column;min-width:0}
.prow .who small{color:var(--muted);font-size:.78rem}
.sep{height:1px;background:var(--line)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .2)}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}
.trows{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:minmax(80px,1fr) minmax(0,1.3fr) minmax(0,1.3fr) 64px;gap:8px;align-items:center}
.trow.th{font-size:.76rem;color:var(--muted)}
.trow.dim{color:var(--muted)}
.trow .hrs{text-align:end;font-size:.82rem;color:var(--muted);line-height:1.2}
.trow .hrs small{display:block;font-size:.7rem}
.trow input[type=time]{padding:6px 8px}
.hotels{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.hchip{font:inherit;font-size:.85rem;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.hchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.nm.ext{outline:1px dashed var(--brass);outline-offset:-1px;color:var(--brass)}
.linkbtn{font:inherit;border:0;background:none;color:var(--brass);padding:0;cursor:pointer;text-decoration:underline}
.code{font-family:var(--f-mono);font-size:1.4rem;letter-spacing:.18em;background:var(--sunk);padding:4px 14px;border-radius:8px;direction:ltr}
.notice{background:var(--brass-bg);color:var(--brass);border-radius:10px;padding:10px 14px;font-size:.9rem}

/* suppliers & invoices */
.secsw button{padding:6px 12px}
.mnav{display:flex;align-items:center;gap:6px}
.mnav b{min-width:8.5em;text-align:center;font-weight:600}
.nb{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.2rem;cursor:pointer}
.amt{font-size:1.02rem;text-align:end}
.irow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,1fr) 32px;gap:6px;align-items:center}
.irow.ith{font-size:.76rem;color:var(--muted)}
.irow input{padding:7px 8px}
.irow .hint{grid-column:1 / -1;font-size:.78rem;margin-top:-2px}
@media (max-width:560px){.irow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr) 32px}.irow .nmf{grid-column:1 / -1}.irow.ith .nmf{display:none}}
.up{color:var(--bad)} .down{color:var(--ok)}
tr.alrt td:first-child b{color:var(--bad)}
table.plain tbody tr[data-act]{cursor:pointer}
table.plain tbody tr[data-act]:hover{background:var(--sunk)}
.rowbtn{width:100%;font:inherit;color:inherit;background:var(--surface);text-align:start;cursor:pointer}
.rowbtn:hover{background:var(--sunk)}
.prevbox{display:flex;flex-direction:column;gap:8px}
.prevbox img{border-radius:8px;border:1px solid var(--line);max-height:60vh;object-fit:contain;background:var(--sunk)}
.spark svg{width:100%;height:auto;display:block;direction:ltr}
.mailtxt{white-space:pre-wrap;font:inherit;font-size:.85rem;background:var(--sunk);padding:10px;border-radius:8px;margin:6px 0 0}
details summary{cursor:pointer}
/* side menu (same pattern as the other apps) */
.burger{width:42px;height:42px;border:0;background:none;color:var(--ink);display:grid;place-items:center;border-radius:10px;cursor:pointer;flex:none}
.burger:hover{background:var(--sunk)}
.top-end{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.drawer-bg{position:fixed;inset:0;background:var(--scrim);z-index:70}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);background:var(--surface);z-index:71;display:flex;flex-direction:column;gap:4px;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));box-shadow:0 0 40px rgb(0 0 0 / .18);overflow-y:auto;overscroll-behavior:contain}
.drawer>*{flex:none}
html:has(.drawer),body:has(.drawer){overflow:hidden}
.drawer .sp{flex:1 0 8px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:drawerIn .22s ease-out}.drawer-bg{animation:fadeIn .2s}}
@keyframes drawerIn{from{transform:translateX(-100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.drawer-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.drawer-h b{font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.drawer-who{font-size:.82rem;color:var(--muted);padding:0 6px 8px;word-break:break-all}
.drawer .item{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:10px;border:0;background:none;font:inherit;font-size:1rem;color:var(--ink);text-decoration:none;cursor:pointer;text-align:start}
.drawer .item:hover{background:var(--sunk)}
.drawer .item[aria-current="page"]{background:var(--sunk);font-weight:600}
.drawer .item svg{color:var(--muted);flex:none}
/* CEO overview */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.hero .big{font-family:var(--f-mono);font-size:clamp(2rem,7vw,2.8rem);line-height:1.1;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.hero .lab{color:var(--muted);font-size:.85rem}
.hero .delta{font-size:.9rem}
.split{display:flex;gap:2px;height:14px;width:100%;margin-top:6px}
.split span{height:100%;min-width:4px}
.split span:first-child{border-radius:0 4px 4px 0}.split span:last-child{border-radius:4px 0 0 4px}

.sw-lab{background:var(--s-lab)} .sw-sup{background:var(--s-sup)}
.trend{display:flex;flex-direction:column;gap:8px}
.trow2{display:grid;grid-template-columns:72px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:.88rem}
.trow2 .stk{display:flex;gap:2px;height:16px}
.trow2 .stk span{height:100%;min-width:3px}
.trow2 .stk span:first-child{border-radius:0 4px 4px 0}.trow2 .stk span:last-child{border-radius:4px 0 0 4px}.trow2 .stk span:only-child{border-radius:4px}
.trow2 .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:end;direction:ltr}
.trow2.cur span:first-child{font-weight:600;color:var(--ink)}
.trow2 [title]{cursor:default}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:12px}
/* invoice scanning */
.scanbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--brass-bg);border:1px dashed var(--brass);border-radius:12px;padding:12px 14px}
.scanbar .t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 220px}
.scanbar .t b{color:var(--brass)}
.scanbar .t small{color:var(--ink);font-size:.84rem;opacity:.8}
.scanbar.busy{border-style:solid}
.scanbar .thumb{width:56px;height:72px;border-radius:6px;object-fit:cover;border:1px solid var(--line);background:var(--surface);flex:none}
.scanbar .pdf{width:56px;height:72px;border-radius:6px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font:600 .78rem var(--f-mono);color:var(--muted);flex:none}
.dots::after{content:'…'}
@media (prefers-reduced-motion:no-preference){.dots::after{content:'';animation:dots 1.2s steps(4) infinite}@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}}
.scanok{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px 14px;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.scanok small{color:var(--ink);opacity:.75}
input.auto,select.auto{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.irow.flag input{border-color:var(--warn)}
.hint.warn{color:var(--warn)}
@media (prefers-reduced-motion:no-preference){.cell,.slot,.btn{transition:background-color .15s,border-color .15s}}

<!-- Invoice scanning: Gemini through Firebase AI Logic, protected by App Check (reCAPTCHA Enterprise). Loaded only when someone scans. -->
<script type="module">
const C=window.APP_CONFIG||{};
if(C.scan&&C.scan.provider==='gemini'){
  const V='12.4.0',B='https://www.gstatic.com/firebasejs/'+V+'/';
  let ready=null;
  const init=()=>ready||(ready=(async()=>{
    const [{initializeApp},{initializeAppCheck,ReCaptchaEnterpriseProvider},{getAI,getGenerativeModel,GoogleAIBackend}]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-app-check.js'),import(B+'firebase-ai.js')]);
    const app=initializeApp(C.firebase,'scan');
    initializeAppCheck(app,{provider:new ReCaptchaEnterpriseProvider(C.scan.siteKey),isTokenAutoRefreshEnabled:true});
    const ai=getAI(app,{backend:new GoogleAIBackend()});
    return (C.scan.models||['gemini-2.5-flash']).map(m=>getGenerativeModel(ai,{model:m,generationConfig:{responseMimeType:'application/json',temperature:0}}));
  })());
  const prompt=sups=>`You read Israeli supplier invoices (usually Hebrew). Return ONLY a JSON object:
{"supplier": string (the issuing business name, as printed), "number": string (invoice number), "date": "YYYY-MM-DD" (invoice date), "total": number (final amount to pay INCLUDING VAT), "items": [{"name": string (item description, in the invoice's language), "unit": string (unit if printed, else ""), "qty": number, "price": number (unit price BEFORE VAT), "total": number (line total BEFORE VAT)}]}
Rules: numbers without currency signs or thousands separators. If the invoice shows prices including VAT per line, convert to before-VAT by dividing by 1.18. Skip lines that are subtotals, VAT, discounts or payment details. If something is unreadable, use "" or 0.
Known suppliers (prefer the exact matching name if it is one of them): ${sups.join(' | ')}`;
  window.SCAN_INVOICE=async req=>{
    const models=await init();let err;
    // try the most accurate model first; on overload, timeout or retirement fall through to the next one
    const limit=(pr,ms)=>Promise.race([pr,new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),ms))]);
    for(const m of models){try{const r=await limit(m.generateContent([{text:prompt(req.suppliers||[])},{inlineData:{mimeType:req.mime,data:req.data}}]),30000);
      let t=r.response.text().trim().replace(/^```(json)?/,'').replace(/```$/,'');return JSON.parse(t)}catch(e){err=e;console.warn('scan model failed',e&&e.message)}}
    console.error('scan failed',err);throw err};
}
</script>
<script>
const CFG=window.APP_CONFIG||{};
const BIZ='גו קנטינה נוריות';
const LS='gk_';
document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','he');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEPTS=[{k:'pass',n:'עובד פס',h:28},{k:'cashier',n:'קופה',h:205},{k:'sushi',n:'שף סושי',h:345},{k:'noodles',n:'שף נודלס',h:145}];
const DMAP=Object.fromEntries(DEPTS.map(d=>[d.k,d]));
const KINDS=[{k:'m',n:'בוקר'},{k:'d',n:'אמצע'},{k:'e',n:'ערב'},{k:'n',n:'לילה'}];
const KMAP=Object.fromEntries(KINDS.map(k=>[k.k,k]));
const KORD={m:0,d:1,e:2,n:3};
const DEF_TIMES={m:{s:'11:00',e:'17:00'},d:{s:'13:00',e:'21:00'},e:{s:'17:00',e:'23:00'},n:{s:'23:00',e:'03:00'}};
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DAYS_S=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const BOWL='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h18"/><path d="M4 12a8 8 0 0 0 16 0"/><path d="M9 20h6"/><path d="M14 9l6-6"/><path d="M11 9l6-6"/></svg>';

/* dates */
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDays(iso,n){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
const dow=iso=>new Date(iso+'T00:00:00Z').getUTCDay();
const weekOf=iso=>addDays(iso,-dow(iso));
const dm=iso=>{const p=iso.split('-');return `${+p[2]}.${+p[1]}`};
const weekLabel=w=>`${dm(w)}–${dm(addDays(w,6))}`;
const weekDates=w=>[0,1,2,3,4,5,6].map(i=>addDays(w,i));
const toMin=t=>{const p=String(t||'0:0').split(':');return (+p[0])*60+(+p[1]||0)};
function span(s){const b=Date.parse(s.date+'T00:00:00Z')/60000,a=toMin(s.start),e=toMin(s.end);return {s:b+a,e:b+(e<=a?e+1440:e)}}
const hrs=s=>{const x=span(s);return (x.e-x.s)/60};
const isShabbat=s=>{const d=dow(s.date);if(d===6)return true;if(d!==5)return false;return span(s).e>Date.parse(s.date+'T00:00:00Z')/60000+18*60};
const ils=n=>{const r=Math.round(n||0);return (r<0?'−':'')+'₪'+Math.abs(r).toLocaleString('he-IL')};
const breakFor=h=>h<4?0.5:h<=8?1:1.5;
const netH=h=>Math.max(0,h-breakFor(h));
const fmtH=n=>(Math.round(n*10)/10).toLocaleString('he-IL');
const sid=(date,dept,kind,h=S.hotel)=>`${date}_${dept}_${kind}`+(h&&h!=='main'?'_'+h:'');
const schedPath=(w,h)=>'schedule/'+(h==='main'?w:w+'_'+h);

/* state ("hotel" internally = branch / סניף) */
const S={db:null,uid:null,admin:false,meName:'',ready:false,noDb:false,
  settingsAll:{},hotels:{},scheds:{},hotel:'main',subKey:'',emps:{},mgr:{},avail:{},shifts:{},
  auth:'pending',roles:{},registering:false,isOwner:false,role:null,email:'',phone:'',week:null,tab:null,dept:'all',drafts:{},sheet:null,pending:false,unsub:[],empsLoaded:false,confirm:null,staff:{},
  sups:{},invs:{},ivMonth:todayISO().slice(0,7),priceSup:'all',fileCache:{},preview:null,busy:false};
Object.defineProperty(S,'sched',{get(){return S.scheds[S.hotel]||{assign:{},published:false}},set(v){S.scheds[S.hotel]=v}});
Object.defineProperty(S,'settings',{get(){return S.settingsAll[S.hotel]||{}},set(v){S.settingsAll[S.hotel]=v}});
function cfg(){const s=S.settings||{};return {overhead:25,shabbatPct:50,restHours:8,availOpen:true,preferGlobal:false,hotelName:'',shareLink:'',deadline:'',accEmail:'',accName:'',priceAlert:5,...s,times:{...DEF_TIMES,...(s.times||{})}}}
function timesFor(dept,kind){const c=cfg(),t=(c.deptTimes||{})[dept]?.[kind];return t&&t.s&&t.e?t:(c.times[kind]||DEF_TIMES[kind])}
function kindsFor(dept){const k=(cfg().deptKinds||{})[dept];return Array.isArray(k)&&k.length?k:['m','e']}
const hrsOf=(a,b)=>{a=toMin(a);b=toMin(b);if(b<=a)b+=1440;return (b-a)/60};
const openWeek=()=>cfg().openWeek||addDays(weekOf(todayISO()),7);
const PERMS=[['ceo','עמוד מנכ״ל','סיכום ההוצאות של החודש'],['shifts','משמרות ועובדים','סידור, משמרות פתוחות ורשימת העובדים, בלי שכר'],['pay','שכר ועלויות','שכר כל עובד, לשונית העלויות והעלויות בסידור'],['suppliers','ספקים וחשבוניות','ספקים, חשבוניות, מעקב מחירים ושליחה לרואה החשבון'],['settings','הגדרות','שעות משמרות, קוד הצטרפות ופרטי רואה החשבון']];

const tabOk=t=>!S.admin?['avail','mine','profile'].includes(t):can(TAB_PERM[t]);

const hotelOf=u=>S.emps[u]?.hotel||'main';

function breakDept(hotel,dept){const b=(S.settingsAll[hotel]?.deptBreaks||{})[dept];return b===undefined?true:!!b}
const paidHrs=s=>{const h=hrs(s);return breakDept(hotelOfShift(s),s.dept)?netH(h):h};
function hotelIds(){return [...new Set(['main',...Object.keys(S.hotels)])].sort((a,b)=>(a==='main'?0:(S.hotels[a]?.createdAt||1))-(b==='main'?0:(S.hotels[b]?.createdAt||1)))}
function visibleHotels(){const all=hotelIds();if(S.isOwner||!S.role||!Array.isArray(S.role.hotels)||!S.role.hotels.length)return all;const v=all.filter(h=>S.role.hotels.includes(h));return v.length?v:all}
function hotelName(h){return S.hotels[h]?.name||S.settingsAll[h]?.hotelName||(h==='main'?BIZ:'סניף')}
const allWeekShifts=()=>{const w=S.week,e=addDays(w,6);return Object.entries(S.shifts).filter(([,s])=>s.date>=w&&s.date<=e&&+s.need>0)};
const asg=id=>{const s=S.shifts[id],h=s?hotelOfShift(s):S.hotel;return (S.scheds[h]?.assign?.[id]||[]).filter(u=>S.emps[u])};

const empName=u=>S.emps[u]?.name||'ללא שם';
const shortName=u=>{const p=empName(u).trim().split(/\s+/);return p.length>1?`${p[0]} ${p[1][0]}׳`:p[0]};

/* writes: one at a time per document, latest value wins */
const wq={};
function save(path,data){const q=wq[path]||(wq[path]={busy:false,next:undefined});q.next=data;if(!q.busy)flush(path)}
async function flush(path){const q=wq[path];q.busy=true;
  while(q.next!==undefined){const d=q.next;q.next=undefined;
    try{d===null?await S.db.doc(path).delete():await S.db.doc(path).set(d)}
    catch(e){toast(errMsg(e))}}
  q.busy=false}
function errMsg(e){const c=e&&e.code;
  if(c==='invalid_argument')return 'לא נשמר: אין לך הרשאה לפעולה הזו.';
  if(c==='quota_exceeded')return 'לא נשמר: נגמר המקום במאגר. כדאי למחוק משמרות של שבועות ישנים.';

/* drafts for form fields */
const dv=(f,k,fb)=>{const d=S.drafts[f];return d&&k in d?d[k]:fb};
function onField(e){const f=e.target.dataset&&e.target.dataset.f;if(!f)return;const [form,key]=f.split('.');(S.drafts[form]||(S.drafts[form]={}))[key]=e.target.type==='checkbox'?e.target.checked:e.target.value;

4\"/><path d=\"M16 17l5-5-5-5\"/><path d=\"M21 12H9\"/></svg>"};
function renderDrawer(){const el=$('#drawer');if(!S.menu||S.auth!=='in'){el.innerHTML='';return}

/* auto-assign: hardest-to-fill shift first, least-loaded available person first */
function autoAssign(){
  const c=cfg(),w=S.week,end=addDays(w,6),rest=(+c.restHours||0)*60;
  const shifts=weekShifts().map(([id,s])=>({id,...s,sp:span(s)}));
  const smap=Object.fromEntries(shifts.map(s=>[s.id,s]));
  const assign={},byUser={};
  for(const s of shifts)assign[s.id]=asg(s.id).filter(isActive);
  for(const [id,o] of allWeekShifts()){const so=smap[id]||{id,...o,sp:span(o)};for(const u of (smap[id]?assign[id]:asg(id)))(byUser[u]||(byUser[u]=[])).push(so)}
  const emps=Object.entries(S.emps).filter(([u])=>isActive(u)&&isHome(u));
  const availN={};for(const [u] of emps)availN[u]=Object.keys(S.avail[u]?.slots||{}).filter(k=>k>=w&&k<=end+'~').length;
  const ok=(u,e,s)=>{
    if(!(e.depts||[]).includes(s.dept)||!S.avail[u]?.slots?.[s.id]||assign[s.id].includes(u))return false;
    const mine=byUser[u]||[];if(mine.length>=maxShiftsOf(u))return false;
    for(const o of mine){if(o.date===s.date)return false;if(s.sp.s<o.sp.e+rest&&o.sp.s<s.sp.e+rest)return false}
    return true};
  const glob=u=>{if(!c.preferGlobal)return 1;return S.mgr[u]?.payType==='global'?0:1};
  const open=new Set(shifts.filter(s=>assign[s.id].length<+s.need).map(s=>s.id));
  let added=0;
  while(open.size){
    let best=null,bc=null;
    for(const id of open){const s=smap[id];const cs=emps.filter(([u,e])=>ok(u,e,s));if(cs.length&&(!best||cs.length<bc.length)){best=s;bc=cs}}
    if(!best)break;
    bc.sort(([a],[b])=>glob(a)-glob(b)||(byUser[a]||[]).length-(byUser[b]||[]).length||availN[a]-availN[b]||empName(a).localeCompare(empName(b),'he'));
    const u=bc[0][0];assign[best.id].push(u);(byUser[u]||(byUser[u]=[])).push(best);added++;
    if(assign[best.id].length>=+best.need)open.delete(best.id);
  }
  let missing=0;shifts.forEach(s=>missing+=Math.max(0,+s.need-assign[s.id].length));
  S.sched={...S.sched,assign:{...(S.sched.assign||{}),...assign}};
  saveSched();render();
  toast(added?`שובצו ${added} משבצות. ${missing?`חסרים עדיין ${missing} עובדים — אין מספיק זמינות.`:'כל המשמרות מאוישות.'}`:(missing?`לא נמצאו עובדים זמינים ל-${missing} משבצות פתוחות.`:'כל המשמרות כבר מאוישות.'));
}

/* conflicts for manual assignment */
function conflictFor(u,s){
  const rest=(+cfg().restHours||0)*60,sp=span(s);
  const me=sid(s.date,s.dept,s.kind,hotelOfShift(s));
  for(const [id,o] of allWeekShifts()){if(id===me)continue;if(!asg(id).includes(u))continue;
    if(o.date===s.date)return 'כבר משובץ באותו יום';const op=span(o);if(sp.s<op.e+rest&&op.s<sp.e+rest)return 'פחות מ-'+cfg().restHours+' שעות מנוחה'}
  return ''}

/* ---------- manager: costs ---------- */
function computeCost(w){
  const c=cfg(),oh=1+(+c.overhead||0)/100,sp=1+(+c.shabbatPct||0)/100,end=addDays(w,6);
  const per={},dept={};DEPTS.forEach(d=>dept[d.k]=0);
  let hourlyT=0,globalT=0,cashT=0,hours=0;
  const P=u=>per[u]||(per[u]={shifts:0,hours:0,shab:0,cost:0});
  for(const [id,s] of Object.entries(S.shifts)){if(s.date<w||s.date>end||!(+s.need)||hotelOfShift(s)!==S.hotel)continue;
    for(const u of asg(id)){const m=S.mgr[u]||{},h=paidHrs(s),sh=isShabbat(s),p=P(u);
      p.shifts++;p.hours+=h;if(sh)p.shab+=h;hours+=h;
      if(m.payType==='hourly'&&+m.rate){const x=h*(+m.rate)*(sh?sp:1)*oh;p.cost+=x;if(s.dept in dept)dept[s.dept]+=x;hourlyT+=x}
      else if(m.payType==='cash'&&+m.rate){const x=h*(+m.rate);p.cost+=x;if(s.dept in dept)dept[s.dept]+=x;cashT+=x}}}
  for(const [u,e] of Object.entries(S.emps)){const m=S.mgr[u]||{};if(!isActive(u)||hotelOf(u)!==S.hotel)continue;
    if(m.payType==='global'&&+m.monthly){const x=(+m.monthly)*12/52*oh;const p=P(u);p.cost+=x;const k=(e.depts||[])[0];if(k&&k in dept)dept[k]+=x;globalT+=x}
}
  return {per,dept,hourlyT,globalT,cashT,total:hourlyT+globalT+cashT,hours};
}
function vCosts(){
  const c=cfg(),w=S.week,cost=computeCost(w),max=Math.max(1,...Object.values(cost.dept));

    ${noPay.length?`<div class="notice">ל-${noPay.length} עובדים עוד לא הוגדר שכר, ולכן הם לא נכנסים לחישוב: ${noPay.slice(0,6).map(u=>esc(empName(u))).join(', ')}${noPay.length>6?'…':''}</div>`:''}</section>`;
  const bars=`<div class="card"><h3>לפי מחלקה</h3><div class="bars">${DEPTS.map(d=>`<div class="bar" style="--h:${d.h}"><span>${d.n}</span><div class="track"><div class="fill" style="width:${(Math.max(0,cost.dept[d.k])/max*100).toFixed(1)}%"></div></div><span class="val">${ils(cost.dept[d.k])}</span></div>`).join('')}</div></div>`;

    ${ids.map(u=>{const p=cost.per[u];return `<tr><td>${esc(empName(u))}${isHome(u)?'':` <span class="pill brass">מ${esc(hotelName(hotelOf(u)))}</span>`}</td><td class="muted">${esc(payLabel(u)||'לא הוגדר')}</td><td class="num">${p.shifts}</td><td class="num">${fmtH(p.hours)}</td><td class="num">${fmtH(p.shab)}</td><td class="num">${ils(p.cost)}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted">עוד אין שיבוצים או עובדים עם שכר לשבוע הזה.</p>'}</div>`;
  const set=`<div class="card"><h3>הנחות החישוב</h3>
    <div class="row"><label class="f">תוספת עלות מעסיק (%)<input type="number" id="c_oh" min="0" max="100" data-f="cost.overhead" value="${esc(dv('cost','overhead',c.overhead))}"></label>

    <label class="check"><input type="checkbox" id="c_pg" data-f="cost.preferGlobal" ${dv('cost','preferGlobal',c.preferGlobal)?'checked':''}> בשיבוץ האוטומטי להעדיף עובדים גלובליים, שכבר משולמים בכל מקרה</label>
    <p class="muted" style="font-size:.85rem">שעות לתשלום הן אחרי הפסקה: עד 4 שעות יורדת חצי שעה, עד 8 שעות שעה, מעל 8 שעות שעה וחצי. אילו מחלקות מקבלות הפסקה נקבע בהגדרות. תוספת עלות מעסיק מכסה ביטוח לאומי, פנסיה ופיצויים. עובדי מזומן נספרים בלי התוספות האלה. תוספת שבת חלה על משמרות שבת ועל משמרות שישי שנמשכות אחרי 18:00. עובד גלובלי נספר לפי השכר החודשי × 12 ÷ 52, במחלקה הראשונה שלו.</p>
    <div><button class="btn pri" data-act="savecost">עדכון החישוב</button></div></div>`;
  return wrap(head+bars+table+set);
}

/* ---------- actions ---------- */
function setTab(t){S.tab=t;S.confirm=null;S.sheet=null;if(t==='ceo')loadCeo(true);try{localStorage.setItem(LS+'tab',t)}catch(_){ }
  if(!S.admin&&t==='avail')setWeek(openWeek());else render();window.scrollTo(0,0)}
function setWeek(w){if(w===S.week){render();return}S.week=w;S.shifts={};S.scheds={};S.confirm=null;subWeek();render()}
function subWeek(){S.unsub.forEach(f=>f());S.unsub=[];const w=S.week;
  S.unsub.push(S.db.collection('shifts').where('date','>=',w).where('date','<=',addDays(w,6)).onSnapshot(q=>{S.shifts=Object.fromEntries(q.docs.map(d=>[d.id,d.data()]));render()},onErr));
  for(const h of hotelIds())S.unsub.push(S.db.doc(schedPath(w,h)).onSnapshot(s=>{S.scheds[h]=s.exists?{assign:{},...s.data()}:{assign:{},published:false};render()},onErr));
  S.subKey=hotelIds().join(',')}
function setHotel(h){S.hotel=h;try{localStorage.setItem(LS+'hotel',h)}catch(_){ }S.dept='all';S.sheet=null;S.confirm=null;['set','cost','send','times'].forEach(k=>S.drafts[k]=null);render();window.scrollTo(0,0)}
function setAssign(id,list){S.sched={...S.sched,assign:{...(S.sched.assign||{}),[id]:list}};saveSched();render()}
function persistSend(){const c=cfg(),d=S.drafts.send||{};const p={};if('link' in d&&d.link!==c.shareLink)p.shareLink=d.link.trim();if('deadline' in d&&d.deadline!==c.deadline)p.deadline=d.deadline.trim();if(Object.keys(p).length)saveSettings(p)}
const ACT={
  tab:D=>setTab(D.t),
  week:D=>setWeek(addDays(S.week,+D.d)),
  dept:D=>{S.dept=D.k;render()},
  cell:D=>{S.sheet={type:'cell',id:D.id,all:false};render()},
  'sh-all':(D,t)=>{S.sheet.all=t.checked;render()},
  'sh-other':(D,t)=>{S.sheet.other=t.checked;render()},
  hotel:D=>setHotel(D.h),
  'hotel-add':()=>{const name=String(dv('nh','name','')).trim();if(!name){toast('צריך לכתוב שם לסניף החדש');return}
    if(!S.hotels.main){S.hotels.main={name:hotelName('main'),createdAt:1};save('hotels/main',S.hotels.main)}
    const id='h'+Math.random().toString(36).slice(2,10);S.hotels[id]={name,createdAt:Date.now()};save('hotels/'+id,S.hotels[id]);
    const base={...cfg()};delete base.openWeek;delete base.joinCode;delete base.accSent;S.settingsAll[id]={...base,hotelName:name,openWeek:openWeek()};save('settings/'+id,S.settingsAll[id]);
    S.drafts.nh=null;subWeek();setHotel(id);toast(`${name} נוסף. עכשיו אתה עובד על הסניף החדש.`)},
  'as-add':D=>setAssign(D.id,[...asg(D.id),D.u]),
  'as-rm':D=>setAssign(D.id,asg(D.id).filter(u=>u!==D.u)),
  auto:()=>autoAssign(),
  publish:()=>{S.sched={...S.sched,published:!S.sched.published};saveSched();render();toast(S.sched.published?'הסידור פורסם. העובדים רואים אותו בלשונית המשמרות שלי.':'הפרסום בוטל. העובדים לא רואים את הסידור.')},
  clear:()=>{if(S.confirm!=='clear'){S.confirm='clear';render();return}S.confirm=null;S.sched={...S.sched,assign:{}};saveSched();render();toast('השיבוץ נוקה')},
  openweek:()=>{saveSettings({openWeek:S.week,availOpen:true});toast(`שבוע ${weekLabel(S.week)} פתוח עכשיו להגשת זמינות`)},
  lock:()=>saveSettings({availOpen:!cfg().availOpen}),
  send:()=>{S.drafts.send=null;S.sheet={type:'send'};render()},
  remsg:()=>{if(S.drafts.send)delete S.drafts.send.msg;render()},
  wa:(D,t)=>{const m=dv('send','msg',composeMsg());t.href='https://wa.me/?text='+encodeURIComponent(m);persistSend()},
  copy:async()=>{const m=dv('send','msg',composeMsg());persistSend();
    try{await navigator.clipboard.writeText(m);toast('ההודעה הועתקה')}catch(_){const ta=$('#s_msg');if(ta){ta.focus();ta.select()}toast('סמנו את ההודעה והעתיקו ידנית')}},
  need:D=>setNeed(D),
  copyprev:()=>copyPrev(),
  savesettings:()=>saveAllSettings(),
  savecost:()=>{const c=cfg(),d=S.drafts.cost||{};saveSettings({overhead:+(d.overhead??c.overhead)||0,shabbatPct:+(d.shabbatPct??c.shabbatPct)||0,preferGlobal:!!(d.preferGlobal??c.preferGlobal)});S.drafts.cost=null;render();toast('החישוב עודכן')},
  'emp-open':D=>{S.drafts.emp=null;S.confirm=null;S.sheet={type:'emp',id:D.u};render()},
  'emp-new':()=>{S.drafts.emp={depts:S.dept!=='all'?[S.dept]:[]};S.sheet={type:'emp',id:'m_'+Math.random().toString(36).slice(2,10)};render()},
  'emp-dept':D=>{const e=S.emps[S.sheet.id]||{};const cur=dv('emp','depts',e.depts||[]);(S.drafts.emp||(S.drafts.emp={})).depts=cur.includes(D.k)?cur.filter(k=>k!==D.k):[...cur,D.k];render()},
  'emp-pay':D=>{(S.drafts.emp||(S.drafts.emp={})).payType=D.v;render()},
  'emp-save':()=>{const u=S.sheet.id,e=S.emps[u]||{},m=S.mgr[u]||{},d=S.drafts.emp||{};
    const name=String(d.name??e.name??'').trim();if(!name){toast('צריך למלא שם');return}
    let pt=d.payType??m.payType??'hourly';if(!['hourly','global','cash'].includes(pt))pt='hourly';
    const emp={...e,name,phone:String(d.phone??e.phone??'').trim(),title:String(d.title??e.title??'').trim(),depts:d.depts??e.depts??[],hotel:d.hotel??e.hotel??S.hotel,manual:e.manual??!S.emps[u],createdAt:e.createdAt||Date.now()};
    const st={active:!!(d.active??isActive(u)),maxShifts:+(d.maxShifts??maxShiftsOf(u))||0};
    S.emps[u]=emp;S.staff[u]=st;save('employees/'+u,emp);save('staff/'+u,st);
    if(can('pay')){const mg={...m,payType:pt,rate:+(d.rate??m.rate??0)||0,monthly:+(d.monthly??m.monthly??0)||0};delete mg.active;delete mg.maxShifts;S.mgr[u]=mg;save('mgr/'+u,mg)}

function mapErr(err){const c=String(err&&err.code||'');return {code:c.includes('permission')?'invalid_argument':c.includes('resource-exhausted')?'quota_exceeded':'unavailable',message:String(err&&err.message||'')}}
const wrapSnap=s=>({id:s.id,exists:!!s.exists,data:()=>s.data()});
function wrapQuery(q){return {

function makeDB(){return {

    delete:async()=>{try{await r.delete()}catch(e){throw mapErr(e)}},
    onSnapshot:(n,e)=>r.onSnapshot(s=>n(wrapSnap(s)),er=>{if(e)e(mapErr(er))})}},
  collection(p){return wrapQuery(fdb.collection(p))}}}

function addMonths(m,n){let y=+m.slice(0,4),mo=+m.slice(5,7)+n;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}return `${y}-${String(mo).padStart(2,'0')}`}
const monthLabel=m=>m&&m.length>=7?`${MONTHS_HE[+m.slice(5,7)-1]} ${m.slice(0,4)}`:'';
const dmy=iso=>{if(!iso)return '';const p=String(iso).split('-');return p.length<3?iso:`${+p[2]}.${+p[1]}.${p[0].slice(2)}`};

const invDate=v=>v.date||((v.month||'')+'-01');

/* every item ever bought from a supplier, with its price history */
function priceData(){
  const map={},thr=+cfg().priceAlert||0;
  for(const [id,v] of myInvs())for(const it of (v.items||[])){const p=+it.price;if(!(p>0)||!it.name)continue;
    const k=v.sup+'|'+normItem(it.name);const r=map[k]||(map[k]={key:k,sup:v.sup,name:it.name,unit:it.unit||'',hist:[]});
    r.hist.push({date:invDate(v),price:p,inv:id,unit:it.unit||'',t:v.createdAt||0,name:it.name})}
  return Object.values(map).map(r=>{r.hist.sort((a,b)=>a.date.localeCompare(b.date)||a.t-b.t);
    const n=r.hist.length,last=r.hist[n-1],prev=n>1?r.hist[n-2]:null,first=r.hist[0];
    r.name=last.name;r.unit=last.unit||r.unit;r.last=last;r.prev=prev;
    r.chg=prev?(last.price-prev.price)/prev.price*100:null;r.since=n>1?(last.price-first.price)/first.price*100:null;
    r.alert=r.chg!==null&&r.chg>0&&r.chg>=thr;return r});
}
function prevPrice(sup,name,excl,before){const k=normItem(name);let best=null;
  for(const [id,v] of myInvs()){if(id===excl||v.sup!==sup)continue;const d=invDate(v);if(before&&d>before)continue;
    for(const it of v.items||[])if(normItem(it.name)===k&&+it.price>0&&(!best||d>best.date||(d===best.date&&(v.createdAt||0)>best.t)))best={date:d,price:+it.price,t:v.createdAt||0}}
  return best}

document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.it;if(!k)return;const [i,f]=k.split('.');const d=invDraft();if(d.items[+i]){d.items[+i][f]=e.target.value;S.pending=true}});
function abToB64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
async function readUpload(f){
  if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){if(f.size>8e6)throw new Error('big');return {name:f.name,type:'application/pdf',data:abToB64(await f.arrayBuffer())}}
  if(f.type.startsWith('image/')){const url=URL.createObjectURL(f);
    try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
      const sc=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
      return {name:safeName(f.name.replace(/\.[^.]+$/,''))+'.jpg',type:'image/jpeg',data:cv.toDataURL('image/jpeg',0.82).split(',')[1]}}
    finally{URL.revokeObjectURL(url)}}
  throw new Error('type')}
document.addEventListener('change',async e=>{if(!e.target.dataset||!e.target.dataset.up)return;const fs=[...(e.target.files||[])];e.target.value='';if(!fs.length)return;const d=invDraft();
  toast('מכין את הקובץ…');
  for(const f of fs){try{const r=await readUpload(f);d.newFiles.push({...r,size:Math.round(r.data.length*3/4)})}
    catch(err){toast(err&&err.message==='big'?`${f.name} גדול מדי. אפשר עד 8MB.`:`${f.name}: אפשר להעלות רק PDF או תמונה.`);continue}}
  $('#toast').hidden=true;render()});
async function loadFileBlob(invId,f){const k=invId+'_'+f.id;if(S.fileCache[k])return S.fileCache[k];let b64='';
  for(let p=0;p<(f.parts||1);p++){const s=await S.db.doc(`invoiceFiles/${invId}_${f.id}_${p}`).get();if(!s.exists)throw new Error('missing');b64+=s.data().data}
  const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const blob=new Blob([u],{type:f.type});S.fileCache[k]=blob;return blob}
async function saveInvoice(){
  const id=S.sheet.id,v=S.invs[id]||{},d=invDraft(),g=(k,fb='')=>k in d?d[k]:(v[k]??fb);
  const sup=g('sup',S.sheet.sup||''),month=g('month',S.ivMonth),amount=+g('amount',0);
  if(!sup){toast('בחרו ספק');return}if(!/^\d{4}-\d{2}$/.test(month)){toast('בחרו חודש');return}if(!(amount>0)){toast('צריך למלא את הסכום של החשבונית');return}
  S.busy=true;render();
  try{
    const rm=d.rmFiles||[],files=(v.files||[]).filter(f=>!rm.includes(f.id));
    for(const f of (v.files||[]).filter(f=>rm.includes(f.id)))for(let p=0;p<(f.parts||1);p++)await S.db.doc(`invoiceFiles/${id}_${f.id}_${p}`).delete();
    for(const n of (d.newFiles||[])){const fid=rid(),parts=Math.max(1,Math.ceil(n.data.length/CHUNK));
      for(let p=0;p<parts;p++)await S.db.doc(`invoiceFiles/${id}_${fid}_${p}`).set({inv:id,part:p,data:n.data.slice(p*CHUNK,(p+1)*CHUNK)});
      files.push({id:fid,name:n.name,type:n.type,size:n.size,parts})}
    const items=(d.items||[]).map(it=>({name:String(it.name||'').trim(),unit:String(it.unit||'').trim(),qty:+it.qty||0,price:+it.price||0})).filter(it=>it.name&&it.price>0);
    const doc={...v,hotel:v.hotel||S.hotel,sup,month,number:String(g('number')).trim(),date:g('date',''),amount,paid:!!g('paid',false),note:String(g('note')).trim(),items,files,createdAt:v.createdAt||Date.now(),updatedAt:Date.now()};
    await S.db.doc('invoices/'+id).set(doc);S.invs[id]=doc;
    S.busy=false;S.drafts.inv=null;S.sheet=null;clearPreview();S.ivMonth=month;render();toast('החשבונית נשמרה');
  }catch(e){S.busy=false;render();toast(errMsg(e))}}
async function deleteInvoice(){const id=S.sheet.id,v=S.invs[id];if(!v)return;

    delete S.invs[id];S.sheet=null;S.drafts.inv=null;S.confirm=null;clearPreview();render();toast('החשבונית נמחקה')}catch(e){toast(errMsg(e))}}

function sparkSVG(h){const W=520,H=130,L=70,R=16,py=18,ps=h.map(x=>x.price),mn=Math.min(...ps),mx=Math.max(...ps),rg=mx-mn||1;
  const X=i=>L+(W-L-R)*(h.length===1?0.5:i/(h.length-1)),Y=p=>H-py-(H-2*py)*(p-mn)/rg;
  const pts=h.map((x,i)=>`${X(i).toFixed(1)},${Y(x.price).toFixed(1)}`).join(' ');
  const lab=(p)=>`<line x1="${L}" x2="${W-R}" y1="${Y(p).toFixed(1)}" y2="${Y(p).toFixed(1)}" style="stroke:var(--line)" stroke-dasharray="3 4"></line><text x="4" y="${(Y(p)+4).toFixed(1)}" style="fill:var(--muted);font:11px var(--f-mono)">${money(p)}</text>`;
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף מחיר לאורך זמן">${lab(mx)}${mx!==mn?lab(mn):''}<polyline points="${pts}" style="fill:none;stroke:var(--brass)" stroke-width="2.5" stroke-linejoin="round"></polyline>${h.map((x,i)=>{const last=i===h.length-1;return `<circle cx="${X(i).toFixed(1)}" cy="${Y(x.price).toFixed(1)}" r="${last?5:3.5}" style="fill:${last?'var(--brass)':'var(--surface)'};stroke:var(--brass)" stroke-width="2"></circle>`}).join('')}</svg></div>`}
function sheetPrice(){const r=priceData().find(x=>x.key===S.sheet.k);if(!r)return '';const h=r.hist;
  return sheetHead(esc(r.name),`${esc(supName(r.sup))}${r.unit?' · '+esc(r.unit):''}`)+
  `<div class="kpis">${kpi('מחיר אחרון',money(r.last.price),dmy(r.last.date))}${kpi('מהפעם הקודמת',r.chg===null?'—':pct(r.chg),r.prev?'היה '+money(r.prev.price):'',r.alert?'bad':'')}${kpi('מההתחלה',r.since===null?'—':pct(r.since),h.length>1?'היה '+money(h[0].price):'')}</div>
  ${h.length>1?sparkSVG(h):''}
  <div class="plist">${[...h].reverse().map((x,i,a)=>{const p=a[i+1],ch=p?(x.price-p.price)/p.price*100:0;return `<button class="prow rowbtn" data-act="inv-open" data-id="${x.inv}"><span class="who"><b>${dmy(x.date)}</b><small>${esc(x.unit||'')}${x.unit?' · ':''}לחיצה פותחת את החשבונית</small></span><span class="mono">${money(x.price)}${ch?` <small class="${ch>0?'up':'down'}">${pct(ch)}</small>`:''}</span></button>`}).join('')}</div>`}

async function prepAcc(){
  const m=S.ivMonth,list=accChosen();S.busy=true;render();
  try{const files=[],used={};
    for(const [id,v] of list){const fl=v.files||[];for(let i=0;i<fl.length;i++){const f=fl[i],blob=await loadFileBlob(id,f),ext=f.type==='application/pdf'?'pdf':'jpg';
      const base=safeName(`${supName(v.sup)} - ${v.number?'חשבונית '+v.number:monthLabel(v.month)}${fl.length>1?' ('+(i+1)+')':''}`);let n=base,k=2;while(used[n])n=`${base} ${k++}`;used[n]=1;
      files.push(new File([blob],`${n}.${ext}`,{type:f.type}))}}
    const rows=[['ספק','מספר חשבונית','תאריך','חודש','סכום כולל מע"מ','שולם','הערות'],...list.map(([,v])=>[supName(v.sup),v.number||'',v.date||'',monthLabel(v.month),v.amount,v.paid?'כן':'לא',v.note||'']),['סה"כ','','','',sumAmt(list),'','']];
    const csv='﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const sumName=safeName(`סיכום חשבוניות ${monthLabel(m)}`)+'.csv',csvFile=new File([csv],sumName,{type:'text/csv'});
    let zip=null;if(window.JSZip){const z=new JSZip();files.forEach(f=>z.file(f.name,f));z.file(sumName,csv);zip=await z.generateAsync({type:'blob'})}
    let share=null;try{const all=[...files,csvFile];if(navigator.canShare){if(navigator.canShare({files:all}))share=all;else if(files.length&&navigator.canShare({files}))share=files}}catch(_){ }
    S.sheet.prep={share,url:URL.createObjectURL(zip||csvFile),zipName:zip?safeName(`חשבוניות ${monthLabel(m)} - ${hotelName(S.hotel)}`)+'.zip':sumName};
  }catch(e){toast('לא הצלחתי להכין את הקבצים. נסו שוב בעוד רגע.')}
  S.busy=false;render()}

S.ceoMonth=todayISO().slice(0,7);S.ceo={key:'',loading:false,shifts:{},scheds:{}};
const monthEnd=m=>addDays(addMonths(m,1)+'-01',-1);
async function loadCeo(force){const m=S.ceoMonth,a=addMonths(m,-5)+'-01',b=monthEnd(m),key=S.hotel+'|'+m;
  if(!force&&(S.ceo.key===key||S.ceo.loading))return;S.ceo={...S.ceo,key,loading:true};
  try{const [sq,dq]=await Promise.all([S.db.collection('shifts').where('date','>=',a).where('date','<=',b).get(),S.db.collection('schedule').get()]);
    if(S.ceo.key!==key)return;
    S.ceo={key,loading:false,shifts:Object.fromEntries(sq.docs.map(d=>[d.id,d.data()])),scheds:Object.fromEntries(dq.docs.map(d=>[d.id,d.data()]))}}
  catch(e){S.ceo={...S.ceo,loading:false};onErr(e)}
  render()}
// labor for one month: hourly and cash by the shifts placed in that month, global salaries in full
function laborMonth(m){const c=cfg(),oh=1+(+c.overhead||0)/100,sp=1+(+c.shabbatPct||0)/100,a=m+'-01',b=monthEnd(m);
  const dept={};DEPTS.forEach(d=>dept[d.k]=0);let hourly=0,glob=0,cash=0,hours=0,shifts=0;
  for(const [id,s] of Object.entries(S.ceo.shifts)){if(s.date<a||s.date>b||!(+s.need)||hotelOfShift(s)!==S.hotel)continue;
    const as=((S.ceo.scheds[schedPath(weekOf(s.date),S.hotel).slice(9)]||{}).assign||{})[id]||[];
    for(const u of as){if(!S.emps[u])continue;const mg=S.mgr[u]||{},hh=paidHrs(s);hours+=hh;shifts++;
      if(mg.payType==='hourly'&&+mg.rate){const x=hh*(+mg.rate)*(isShabbat(s)?sp:1)*oh;hourly+=x;if(s.dept in dept)dept[s.dept]+=x}
      else if(mg.payType==='cash'&&+mg.rate){const x=hh*(+mg.rate);cash+=x;if(s.dept in dept)dept[s.dept]+=x}}}
  for(const [u,e] of Object.entries(S.emps)){const mg=S.mgr[u]||{};if(!isActive(u)||hotelOf(u)!==S.hotel)continue;
    if(e.createdAt>1e12&&new Date(e.createdAt).toISOString().slice(0,7)>m)continue;
    if(mg.payType==='global'&&+mg.monthly){const x=(+mg.monthly)*oh;glob+=x;const k=(e.depts||[])[0];if(k&&k in dept)dept[k]+=x}}
  return {total:hourly+glob+cash,hourly,glob,cash,hours,shifts,dept}}
function supMonth(m){const list=myInvs().filter(([,v])=>v.month===m),by={};for(const [,v] of list)by[v.sup]=(by[v.sup]||0)+(+v.amount||0);
  return {total:sumAmt(list),count:list.length,unpaid:sumAmt(list.filter(([,v])=>!v.paid)),by}}
function vCeo(){

  const hero=`<div class="hero"><div style="flex:1 1 260px;min-width:0"><div class="lab">סה״כ הוצאות ${monthLabel(m)}</div><div class="big">${ils(tot)}</div>

    <div style="flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:6px">
      <div class="legend"><span><i class="sw-sup"></i>ספקים ${ils(P.total)} · ${Math.round(share(P.total))}%</span><span><i class="sw-lab"></i>עובדים ${ils(L.total)} · ${Math.round(share(L.total))}%</span></div>
      ${tot?`<div class="split" role="img" aria-label="ספקים ${Math.round(share(P.total))}%, עובדים ${Math.round(share(L.total))}%">${P.total?`<span class="sw-sup" style="width:${share(P.total)}%" title="ספקים ${ils(P.total)}"></span>`:''}${L.total?`<span class="sw-lab" style="width:${share(L.total)}%" title="עובדים ${ils(L.total)}"></span>`:''}</div>`:'<div class="split"><span style="width:100%;background:var(--sunk)"></span></div>'}

  </div>`;

  const trend=`<div class="card"><div class="panel-h"><h3>חצי שנה אחרונה</h3><div class="legend"><span><i class="sw-sup"></i>ספקים</span><span><i class="sw-lab"></i>עובדים</span></div></div>

  const dmx=Math.max(1,...Object.values(L.dept));
  const labCard=`<div class="card"><h3>עובדים לפי מחלקה</h3>${L.total?`<div class="bars">${DEPTS.map(d=>`<div class="bar"><span>${d.n}</span><div class="track"><div class="fill" style="width:${(L.dept[d.k]/dmx*100).toFixed(1)}%;background:var(--s-lab)" title="${ils(L.dept[d.k])}"></div></div><span class="val">${ils(L.dept[d.k])}</span></div>`).join('')}</div>

let START_DATA=null;
function importHTML(){if(!can('suppliers')||cfg().imported)return '';
  if(!START_DATA)return `<div class="sep"></div><h3>נתונים התחלתיים</h3><p class="muted" style="font-size:.85rem">בוחרים את הקובץ cantina-start-data.json מהמחשב. הוא מכניס את הספקים והחשבוניות שהוכנו מראש. הקובץ לא עולה לאינטרנט, רק הנתונים שבו נשמרים במערכת.</p><div><label class="btn">בחירת הקובץ<input type="file" id="imp_file" accept=".json,application/json" hidden data-impfile="1"></label></div>`;
  const n=START_DATA.invoices.length,m=Object.keys(START_DATA.suppliers).length;
  return `<div class="sep"></div><h3>נתונים התחלתיים</h3><p class="muted" style="font-size:.85rem">בקובץ: ${m} ספקים ו-${n} חשבוניות, כולל הפריטים והמחירים. ספק שכבר קיים לא ייווצר פעמיים.</p><div><button class="btn pri" data-act="do-import" ${S.busy?'disabled':''}>${S.busy?'מייבא…':'ייבוא'}</button></div>`}
document.addEventListener('change',async e=>{if(!e.target.dataset||!e.target.dataset.impfile)return;const f=(e.target.files||[])[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(d.kind!=='cantina-start-data'||!d.suppliers||!Array.isArray(d.invoices))throw 0;START_DATA=d;render()}catch(_){toast('זה לא קובץ הנתונים הנכון. צריך לבחור את cantina-start-data.json.')}});
async function doImport(){if(S.busy)return;S.busy=true;render();
  try{const ids={},have=Object.fromEntries(mySups().map(([id,s])=>[normSup(s.name),id]));let ns=0,ni=0;
    for(const [k,v] of Object.entries(START_DATA.suppliers)){const ex=have[normSup(v.name)];
      if(ex){ids[k]=ex;const cur=S.sups[ex];const doc={...cur};for(const f of ['cat','bn','phone','email','note'])if(!doc[f]&&v[f])doc[f]=v[f];await S.db.doc('suppliers/'+ex).set(doc);S.sups[ex]=doc;continue}
      const id='s'+rid();ids[k]=id;const doc={hotel:S.hotel,name:v.name,cat:v.cat||'',contact:'',phone:v.phone||'',email:v.email||'',bn:v.bn||'',terms:'',note:v.note||'',active:true,createdAt:Date.now()};
      await S.db.doc('suppliers/'+id).set(doc);S.sups[id]=doc;ns++}
    for(const v of START_DATA.invoices){const id='imp_'+v.sup+'_'+v.number;if(S.invs[id])continue;
      const doc={hotel:S.hotel,sup:ids[v.sup],month:v.month,number:v.number,date:v.date,amount:v.amount,paid:!!v.paid,note:v.note||'',items:v.items||[],files:[],createdAt:Date.parse(v.date)||Date.now(),updatedAt:Date.now()};
      await S.db.doc('invoices/'+id).set(doc);S.invs[id]=doc;ni++}
    saveSettings({imported:Date.now()});toast(`יובאו ${ns} ספקים חדשים ו-${ni} חשבוניות`)}
  catch(e){toast(errMsg(e))}
  S.busy=false;render()}
Object.assign(ACT,{'do-import':()=>doImport()});

Object.assign(ACT,{ceom:D=>{S.ceoMonth=addMonths(S.ceoMonth,+D.d);loadCeo(true);render()}});

/* ================= invoice scanning ================= */
// The reader is plugged in from outside: window.SCAN_INVOICE({mime,data,suppliers}) -> {supplier,number,date,total,items:[{name,unit,qty,price,total}]}
async function scanProvider(req){if(typeof window.SCAN_INVOICE==='function')return window.SCAN_INVOICE(req);const e=new Error('not_connected');e.code='not_connected';throw e}
function scanHTML(d,nf){const sc=d.scan||{};
  if(sc.status==='busy'){const f=nf[sc.file]||nf[nf.length-1];
    return `<div class="scanbar busy">${f&&f.type.startsWith('image/')?`<img class="thumb" src="data:${f.type};base64,${f.data}" alt="">`:'<span class="pdf">PDF</span>'}<div class="t"><b class="dots">קורא את החשבונית</b><small>מזהה ספק, תאריך, סכום וכל השורות. זה לוקח כמה שניות.</small></div></div>`}
  if(sc.status==='done'){const r=sc.sum;
    return `<div class="scanok"><b>המערכת מילאה את הפרטים מהחשבונית</b><span>${r.fields.join(', ')}${r.items?` ו-${r.items} פריטים`:''}. השדות שמולאו מסומנים במסגרת צהובה.</span>${r.flags?`<span style="color:var(--warn)">${r.flags===1?'שורה אחת לא מסתדרת':r.flags+' שורות לא מסתדרות'}: הכמות כפול המחיר לא יוצא כמו הסכום של השורה בחשבונית. כדאי לבדוק ${r.flags===1?'אותה':'אותן'} לפני השמירה.</span>`:''}${window.SCAN_NOTE?`<small>${esc(window.SCAN_NOTE)}</small>`:''}</div>
    ${sc.unknownSup?`<div class="notice">הספק "${esc(sc.unknownSup)}" לא נמצא ברשימת הספקים. <button class="linkbtn" data-act="scan-addsup">הוספה כספק חדש</button></div>`:''}`}
  if(sc.status==='error')return `<div class="notice">${esc(sc.msg)}</div>`;
  return `<div class="scanbar"><div class="t"><b>סריקה אוטומטית</b><small>מצלמים את החשבונית או מעלים PDF, והמערכת ממלאת את הספק, הסכום ואת כל הפריטים עם המחירים.</small></div>
    ${nf.length?'<button class="btn pri" data-act="scan-file">מילוי מהקובץ שצורף</button>':'<label class="btn pri">צילום או קובץ<input type="file" id="scan_in" accept="image/*,application/pdf" hidden data-scan="1"></label>'}</div>`}
const normSup=s=>String(s||'').replace(/בע["״]?מ|בעמ|ltd\.?|\(.*?\)|["'״׳.,\-]/gi,' ').replace(/\s+/g,' ').trim().toLowerCase();
function matchSup(name){const n=normSup(name);if(!n)return '';let best='',bl=0;
  for(const [id,s] of mySups()){const m=normSup(s.name);if(!m)continue;if(m===n)return id;if((n.includes(m)||m.includes(n))&&m.length>bl){best=id;bl=m.length}}return best}
function matchItem(name,known){const n=normItem(name);if(!n)return null;let best=null,bl=0;
  for(const r of known){const m=normItem(r.name);if(m===n)return r;if((n.includes(m)||m.includes(n))&&Math.min(m.length,n.length)>=4&&m.length>bl){best=r;bl=m.length}}return best}
async function runScan(idx){const d=invDraft(),f=d.newFiles[idx];if(!f)return;
  d.scan={status:'busy',file:idx};render();
  try{const res=await scanProvider({mime:f.type,data:f.data,suppliers:mySups().map(([,s])=>s.name)});
    if(!S.sheet||S.sheet.type!=='inv'||S.drafts.inv!==d)return;
    const auto={},fields=[];const sup=matchSup(res.supplier);
    if(sup){d.sup=sup;auto.sup=1;fields.push('ספק')}
    if(res.number){d.number=String(res.number);auto.number=1;fields.push('מספר חשבונית')}
    if(/^\d{4}-\d{2}-\d{2}$/.test(res.date||'')){d.date=res.date;d.month=res.date.slice(0,7);auto.date=auto.month=1;fields.push('תאריך')}
    if(+res.total>0){d.amount=String(Math.round(+res.total*100)/100);auto.amount=1;fields.push('סכום')}
    const known=sup?priceData().filter(r=>r.sup===sup):[];let flags=0;
    d.items=(res.items||[]).filter(it=>it&&it.name).map(it=>{const k=matchItem(it.name,known),q=+it.qty||0,p=+it.price||0,t=+it.total||0;
      let flag='';if(t>0&&q>0&&p>0&&Math.abs(q*p-t)>Math.max(0.05,t*0.02)){flag=`בחשבונית סה״כ השורה ${money(t)}, אבל ${q} × ${money(p)} = ${money(q*p)}`;flags++}
      return {name:k?k.name:String(it.name).trim(),unit:String(it.unit||(k&&k.unit)||'').trim(),qty:q||'',price:p||'',_flag:flag,_new:!k}});
    d.auto=auto;d.scan={status:'done',file:idx,unknownSup:sup?'':String(res.supplier||'').trim(),sum:{fields,items:d.items.length,flags}};
  }catch(e){if(S.drafts.inv!==d)return;d.scan={status:'error',msg:e&&e.code==='not_connected'?'הסריקה האוטומטית עוד לא מחוברת באפליקציה. הקובץ כבר צורף, ובינתיים ממלאים את הפרטים ידנית.':'לא הצלחתי לקרוא את החשבונית. נסו צילום ישר וחד יותר, או מלאו ידנית.'}}
  render()}
document.addEventListener('change',async e=>{if(!e.target.dataset||!e.target.dataset.scan)return;const f=(e.target.files||[])[0];e.target.value='';if(!f)return;
  if(!S.sheet||S.sheet.type!=='inv')openInv('i'+rid());
  const d=invDraft();let r;try{r=await readUpload(f)}catch(err){toast(err&&err.message==='big'?`${f.name} גדול מדי. אפשר עד 8MB.`:'אפשר לסרוק רק PDF או תמונה.');return}
  d.newFiles.push({...r,size:Math.round(r.data.length*3/4)});runScan(d.newFiles.length-1)});
Object.assign(ACT,{
  'scan-file':()=>runScan(invDraft().newFiles.length-1),
  'scan-addsup':()=>{const d=invDraft(),name=d.scan&&d.scan.unknownSup;if(!name)return;const id='s'+rid();
    S.sups[id]={hotel:S.hotel,name,cat:'',contact:'',phone:'',email:'',bn:'',note:'',terms:'',active:true,createdAt:Date.now()};save('suppliers/'+id,S.sups[id]);
    d.sup=id;(d.auto||(d.auto={})).sup=1;d.scan.unknownSup='';render();toast(`${name} נוסף לספקים`)},
});

async function start(u){
  S.db=makeDB();const db=S.db;
  S.uid=u.uid;S.meName=u.displayName||'';S.email=String(u.email||'').toLowerCase();S.phone=u.phoneNumber||'';
  S.isOwner=!!(S.email&&u.emailVerified&&S.email===String(CFG.ownerEmail||'').trim().toLowerCase());
  try{const r=await db.doc('roles/'+u.uid).get();if(r.exists)S.role=r.data()}catch(_){ }
  S.admin=S.isOwner||!!S.role;S.auth='in';
  if(!S.admin){let me=null;try{const m=await db.doc('employees/'+u.uid).get();if(m.exists)me=m.data()}catch(_){ }
    if(!me){S.registering=true;S.ready=true;render();return}
    S.hotel=me.hotel||'main'}
  try{const [st,ht]=await Promise.all([db.collection('settings').get(),db.collection('hotels').get()]);S.settingsAll=docsMap(st);S.hotels=docsMap(ht);
    if(S.admin){let h=null;try{h=localStorage.getItem(LS+'hotel')}catch(_){ }const vis=visibleHotels();S.hotel=vis.includes(h)?h:vis[0]}
    if(!S.settingsAll.main&&S.isOwner){S.settingsAll.main={openWeek:addDays(weekOf(todayISO()),7),availOpen:true,overhead:25,shabbatPct:50,restHours:8,times:DEF_TIMES,preferGlobal:false,hotelName:BIZ,deadline:''};save('settings/main',S.settingsAll.main)}}
  catch(e){onErr(e)}
  S.week=openWeek();
  let t=null;try{t=localStorage.getItem(LS+'tab')}catch(_){ }
  const allowed=S.admin?Object.values(TABS).flat().map(([k])=>k).filter(tabOk):['avail','mine','profile'];S.tab=allowed.includes(t)?t:allowed[0];
  db.collection('hotels').onSnapshot(q=>{S.hotels=docsMap(q);if(S.ready&&hotelIds().join(',')!==S.subKey)subWeek();render()},onErr);
  db.collection('settings').onSnapshot(q=>{S.settingsAll=docsMap(q);if(!S.admin&&S.tab==='avail'&&S.week!==openWeek())setWeek(openWeek());else render()},onErr);
  db.collection('employees').onSnapshot(q=>{S.emps=docsMap(q);S.empsLoaded=true;
    if(!S.admin&&S.emps[S.uid]){const h=hotelOf(S.uid);if(h!==S.hotel){S.hotel=h;if(S.tab==='avail'&&S.week!==openWeek()){setWeek(openWeek());return}}}
    render()},onErr);
  if(S.admin){
    if(can('suppliers')||can('ceo')){db.collection('suppliers').onSnapshot(q=>{S.sups=docsMap(q);render()},onErr);db.collection('invoices').onSnapshot(q=>{S.invs=docsMap(q);render()},onErr)}
    if(can('pay')||can('ceo'))db.collection('mgr').onSnapshot(q=>{S.mgr=docsMap(q);render()},onErr);
    db.collection('staff').onSnapshot(q=>{S.staff=docsMap(q);render()},onErr);
    if(can('shifts'))db.collection('avail').onSnapshot(q=>{S.avail=docsMap(q);render()},onErr)}
  else{db.doc('avail/'+S.uid).onSnapshot(s=>{if(s.exists)S.avail[S.uid]=s.data();render()},onErr)}
  if(S.isOwner)db.collection('roles').onSnapshot(q=>{S.roles=docsMap(q);render()},onErr);
  subWeek();S.ready=true;render();
}
(function boot(){
  render();
  const fc=CFG.firebase||{};
  if(!window.firebase||!fc.apiKey||String(fc.apiKey).includes('PASTE')){S.noCfg=true;render();return}
  firebase.initializeApp(fc);fdb=firebase.firestore();try{fdb.settings({ignoreUndefinedProperties:true})}catch(_){ }
  fauth=firebase.auth();fauth.languageCode='he';
  fauth.getRedirectResult().catch(e=>toast('הכניסה לא הצליחה ('+(e.code||'')+')'));
  let started=false;
  fauth.onAuthStateChanged(u=>{if(u&&!started){started=true;start(u)}else if(!u){if(started)location.reload();else{S.auth='out';render()}}});
})();
</script>
